# Canonical production recipe: 500K, K5, state4, mass/friction grid, train0-99/val10000-10019.
# Exported from the actual matched roundabout Full H5 run; paths are portable.
env:
  task: metadrive_roundabout
  steps: 500000
  env_num: 8
  eval_episode_num: 20
  eval_env_num: 2
  action_repeat: 1
  train_ratio: 512
  time_limit: 1000
  seed: ${seed}
  device: ${device}
  start_seed: 0
  num_scenarios: 100
  eval_start_seed: 10000
  eval_num_scenarios: 20
  lane_num: 2
  traffic_density: 0.2
  traffic_mode: trigger
  decision_repeat: 5
  reward:
    mode: paper
    progress: 1.0
    speed: 0.1
    lateral: 0.0
    success: 10.0
    crash: 20.0
    out_of_road: 10.0
    max_speed_km_h: 50.0
  spawn:
    randomize: true
    longitude_min: 5.0
    longitude_max: 25.0
    lateral_max: 0.5
  termination:
    out_of_road_done: true
    on_continuous_line_done: true
    on_broken_line_done: false
    out_of_route_done: false
  lidar:
    num_lasers: 240
    distance: 50
    num_others: 0
  encoder:
    mlp_keys: ^state$
    cnn_keys: $^
  decoder:
    mlp_keys: ^state$
    cnn_keys: $^
  context_enabled: true
  context_kinematics: true
  chassis:
    enabled: true
    models:
    - default
    - m
    - l
    mass_scales:
    - 0.6
    - 0.7
    - 0.8
    - 0.9
    - 1.0
    - 1.1
    - 1.2
    - 1.3
    - 1.4
    steering_scales:
    - 1.0
    eval_models: ${env.chassis.models}
    eval_mass_scales: ${env.chassis.mass_scales}
    eval_steering_scales: ${env.chassis.steering_scales}
    friction_scales:
    - 0.6
    - 0.7
    - 0.8
    - 0.9
    - 1.0
    - 1.1
    - 1.2
    - 1.3
    - 1.4
    eval_friction_scales: ${env.chassis.friction_scales}
  map_block: O
model:
  act_entropy: 0.0003
  kl_free: 1.0
  imag_horizon: 15
  horizon: 333
  lamb: 0.95
  compile: true
  log_grads: false
  device: ${device}
  rep_loss: r2dreamer
  lr: 4.0e-05
  agc: 0.3
  pmin: 0.001
  eps: 1.0e-20
  beta1: 0.9
  beta2: 0.999
  warmup: 1000
  slow_target_update: 1
  slow_target_fraction: 0.02
  loss_scales:
    barlow: 0.05
    infonce: 1.0
    recon: 1.0
    rew: 1.0
    con: 1.0
    dyn: 1.0
    rep: 0.1
    policy: 1.0
    value: 1.0
    repval: 0.3
    swav: 1.0
    temp: 1.0
    norm: 1.0
  r2dreamer:
    lambd: 0.0005
  dreamer_pro:
    warm_up: 1
    num_prototypes: 2500
    proto_dim: 32
    temperature: 0.1
    sinkhorn_eps: 0.05
    sinkhorn_iters: 3
    ema_update_every: 1
    ema_update_fraction: 0.05
    freeze_prototypes_iters: 10000
    aug:
      max_delta: 3.0
      same_across_time: true
      bilinear: true
  rssm:
    stoch: 32
    deter: ${model.deter}
    hidden: ${model.hidden}
    discrete: ${model.discrete}
    img_layers: 2
    obs_layers: 1
    dyn_layers: 1
    blocks: 8
    act: ${model.act}
    norm: ${model.norm}
    unimix_ratio: 0.01
    initial: learned
    device: ${device}
  encoder:
    mlp_keys: ${env.encoder.mlp_keys}
    cnn_keys: ${env.encoder.cnn_keys}
    mlp:
      shape: null
      layers: 3
      units: ${model.units}
      act: ${model.act}
      norm: ${model.norm}
      device: ${device}
      outscale: null
      symlog_inputs: true
      name: mlp_encoder
    cnn:
      act: ${model.act}
      norm: ${model.norm}
      kernel_size: 5
      minres: 4
      depth: ${model.depth}
      mults:
      - 2
      - 3
      - 4
      - 4
  decoder:
    mlp_keys: ${env.decoder.mlp_keys}
    cnn_keys: ${env.decoder.cnn_keys}
    mlp_dist:
      name: symlog_mse
    cnn_dist:
      name: mse
    mlp:
      shape: null
      layers: 3
      units: ${model.units}
      act: ${model.act}
      norm: ${model.norm}
      dist:
        name: identity
      device: ${device}
      outscale: 1.0
      symlog_inputs: false
      name: mlp_decoder
    cnn:
      depth: ${model.depth}
      units: ${model.units}
      bspace: 8
      mults:
      - 2
      - 3
      - 4
      - 4
      act: ${model.act}
      norm: ${model.norm}
      kernel_size: 5
      minres: 4
      outscale: 1.0
  reward:
    shape:
    - 255
    layers: 1
    units: ${model.units}
    act: ${model.act}
    norm: ${model.norm}
    dist:
      name: symexp_twohot
      bin_num: 255
    outscale: 0.0
    device: ${device}
    symlog_inputs: false
    name: reward
  cont:
    shape:
    - 1
    layers: 1
    units: ${model.units}
    act: ${model.act}
    norm: ${model.norm}
    dist:
      name: binary
    outscale: 1.0
    device: ${device}
    symlog_inputs: false
    name: cont
  actor:
    shape: null
    layers: 3
    units: ${model.units}
    act: ${model.act}
    norm: ${model.norm}
    device: ${device}
    dist:
      cont:
        name: bounded_normal
        min_std: 0.1
        max_std: 1.0
      disc:
        name: onehot
        unimix_ratio: 0.01
      multi_disc:
        name: multi_onehot
        unimix_ratio: 0.01
    outscale: 0.01
    symlog_inputs: false
    name: actor
  critic:
    shape:
    - 255
    layers: 3
    units: ${model.units}
    act: ${model.act}
    norm: ${model.norm}
    device: ${device}
    dist:
      name: symexp_twohot
      bin_num: 255
    outscale: 0.0
    symlog_inputs: false
    name: value
  context:
    enabled: true
    injection: dali_shallow
    rollout: dynamic
    aux_weight: 1.0
    swap_weight: 1.0
    actor_critic: false
    wm_grad_scale: 0.0
  deter: 2048
  hidden: 256
  discrete: 16
  depth: 16
  units: 256
  act: SiLU
  norm: true
logdir: logdir/roundabout_500k/seed${seed}
seed: 0
deterministic_run: false
device: cuda:0
batch_size: 16
batch_length: 64
buffer:
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  max_size: 500000
  device: ${device}
  storage_device: cpu
trainer:
  steps: ${env.steps}
  pretrain: 0
  eval_every: 10000.0
  eval_episode_num: ${env.eval_episode_num}
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  train_ratio: ${env.train_ratio}
  video_pred_log: false
  params_hist_log: false
  update_log_every: 5000.0
  action_repeat: ${env.action_repeat}
  save_best: true
hydra:
  run:
    dir: ${logdir}
